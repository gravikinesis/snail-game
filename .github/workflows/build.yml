name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Bundle the map library into the app
        run: |
          mkdir -p www/lib
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/lib/
          cp -r node_modules/leaflet/dist/images www/lib/

      - name: Create the Android project
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Use the fixed signing key (so updates install over the old version)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk snail-game.apk
          gh release create "build-${{ github.run_number }}" snail-game.apk \
            --title "Snail Game build ${{ github.run_number }}" \
            --notes "Tap snail-game.apk below to download it on your Android phone, then open it to install." \
            --latest
